<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#222">Multi-Agent System Architecture for Error Triage</text>
  
  <!-- Input: Error Log -->
  <rect x="30" y="180" width="100" height="60" rx="5" fill="#e8e8e8" stroke="#999" stroke-width="1.5"/>
  <text x="80" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Regression</text>
  <text x="80" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Error Log</text>
  
  <!-- Agent 1: Error Analyzer -->
  <rect x="160" y="70" width="120" height="70" rx="8" fill="#4a90d9" stroke="#2d5a8a" stroke-width="2"/>
  <text x="220" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Error Analyzer</text>
  <text x="220" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e0e0e0">Classification</text>
  <text x="220" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e0e0e0">+ SOP Retrieval</text>
  
  <!-- Agent 2: Data Collector -->
  <rect x="310" y="70" width="120" height="70" rx="8" fill="#4a90d9" stroke="#2d5a8a" stroke-width="2"/>
  <text x="370" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Data Collector</text>
  <text x="370" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e0e0e0">Information</text>
  <text x="370" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e0e0e0">Gathering</text>
  
  <!-- Agent 3: Decision Maker -->
  <rect x="460" y="70" width="120" height="70" rx="8" fill="#4a90d9" stroke="#2d5a8a" stroke-width="2"/>
  <text x="520" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Decision Maker</text>
  <text x="520" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e0e0e0">Risk Assessment</text>
  <text x="520" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e0e0e0">+ Recommendation</text>
  
  <!-- Agent 4: Auto Executor -->
  <rect x="610" y="70" width="120" height="70" rx="8" fill="#5cb85c" stroke="#3d8b3d" stroke-width="2"/>
  <text x="670" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Auto Executor</text>
  <text x="670" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e0e0e0">Safe Execution</text>
  <text x="670" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e0e0e0">(Low-risk only)</text>
  
  <!-- Agent 5: Notification -->
  <rect x="610" y="180" width="120" height="60" rx="8" fill="#f0ad4e" stroke="#c49a3a" stroke-width="2"/>
  <text x="670" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Notification</text>
  <text x="670" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff">Report Generation</text>
  
  <!-- Output: Engineer -->
  <rect x="610" y="290" width="120" height="60" rx="5" fill="#e8e8e8" stroke="#999" stroke-width="1.5"/>
  <text x="670" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Verification</text>
  <text x="670" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Engineer</text>
  
  <!-- Database: Pattern DB -->
  <ellipse cx="220" cy="210" rx="55" ry="30" fill="#d9edf7" stroke="#5bc0de" stroke-width="1.5"/>
  <text x="220" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#31708f">Pattern</text>
  <text x="220" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#31708f">Database</text>
  
  <!-- Database: Spec DB -->
  <ellipse cx="370" cy="210" rx="55" ry="30" fill="#d9edf7" stroke="#5bc0de" stroke-width="1.5"/>
  <text x="370" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#31708f">Specification</text>
  <text x="370" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#31708f">Database</text>
  
  <!-- Database: File System -->
  <ellipse cx="520" cy="210" rx="55" ry="30" fill="#d9edf7" stroke="#5bc0de" stroke-width="1.5"/>
  <text x="520" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#31708f">File System</text>
  <text x="520" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#31708f">& Logs</text>
  
  <!-- Arrows: Main flow -->
  <line x1="130" y1="200" x2="155" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="280" y1="105" x2="305" y2="105" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="430" y1="105" x2="455" y2="105" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="580" y1="105" x2="605" y2="105" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="670" y1="140" x2="670" y2="175" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="670" y1="240" x2="670" y2="285" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrows: Database connections -->
  <line x1="220" y1="140" x2="220" y2="175" stroke="#666" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowhead-gray)"/>
  <line x1="370" y1="140" x2="370" y2="175" stroke="#666" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowhead-gray)"/>
  <line x1="520" y1="140" x2="520" y2="175" stroke="#666" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowhead-gray)"/>
  
  <!-- Legend -->
  <rect x="30" y="400" width="740" height="80" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="420" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Legend:</text>
  
  <rect x="50" y="435" width="20" height="15" rx="3" fill="#4a90d9" stroke="#2d5a8a"/>
  <text x="80" y="447" font-family="Arial, sans-serif" font-size="10" fill="#333">Analysis Agent</text>
  
  <rect x="180" y="435" width="20" height="15" rx="3" fill="#5cb85c" stroke="#3d8b3d"/>
  <text x="210" y="447" font-family="Arial, sans-serif" font-size="10" fill="#333">Execution Agent</text>
  
  <rect x="330" y="435" width="20" height="15" rx="3" fill="#f0ad4e" stroke="#c49a3a"/>
  <text x="360" y="447" font-family="Arial, sans-serif" font-size="10" fill="#333">Output Agent</text>
  
  <ellipse cx="490" cy="442" rx="15" ry="10" fill="#d9edf7" stroke="#5bc0de"/>
  <text x="515" y="447" font-family="Arial, sans-serif" font-size="10" fill="#333">External Resource</text>
  
  <line x1="620" y1="442" x2="650" y2="442" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="660" y="447" font-family="Arial, sans-serif" font-size="10" fill="#333">Data Flow</text>
  
  <text x="50" y="470" font-family="Arial, sans-serif" font-size="10" fill="#666">* Auto Executor only processes low-risk actions (risk score ≤ 3) with mandatory backup and rollback capability</text>
</svg>
